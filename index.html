<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- ★ ページタイトル(ブラウザのタブに表示される) -->
  <title>入力フォーム</title>

  <!-- 外部CSSファイルの読み込み(見た目の変更は style.css で行う) -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">

    <!-- ★ サイトの見出し。自由に変更OK -->
    <h1>入力フォーム</h1>

    <!--
      ■ 入力フォーム部分
      送信が成功すると、JS側でこの <form> を非表示(hidden)にします。
      <form> の id="entry-form" は script.js から参照しているので、変更する場合は両方直すこと。
    -->
    <form id="entry-form" novalidate>

      <!-- 入力欄①(DBでは「キー側」または「1つ目の値」になる) -->
      <label for="input1">入力欄①</label>
      <input type="text" id="input1" maxlength="100" placeholder="例: りんご" required>

      <!-- 入力欄②(DBでは「値側」または「2つ目の値」になる) -->
      <label for="input2">入力欄②</label>
      <input type="text" id="input2" maxlength="100" placeholder="例: 赤い果物" required>

      <!-- エラーメッセージ表示用(通常は空。未入力や送信失敗時にJSが文字を入れる) -->
      <p id="error-message" class="error" role="alert"></p>

      <!-- 送信ボタン -->
      <button type="submit" id="submit-button">送信する</button>
    </form>

    <!--
      ■ 送信完了メッセージ
      最初は hidden 属性で非表示。送信成功後にJSが hidden を外して表示します。
    -->
    <div id="thanks" class="thanks" hidden>
      <h2>ありがとうございました</h2>
      <p>送信が完了しました。</p>
    </div>

  </main>

  <!-- type="module" が必須(Firebaseを import で読み込むため) -->
  <script type="module" src="script.js"></script>
</body>
</html>
